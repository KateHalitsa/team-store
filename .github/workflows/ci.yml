name: Проверки проекта

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version
          npm config get omit
          npm config get optional
      - name: Check lockfile dependencies
        run: |
          npm ls @emnapi/core @emnapi/runtime --package-lock-only || true
          npm ls @rolldown/binding-wasm32-wasi --package-lock-only || true
      - run: npm ci
      - run: npm run build
      - run: npm test